<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* CSS STYLING */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            color: #bb86fc;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .form-card {
            background-color: #161616;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 30px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 30px;
        }
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
            color: #eee;
        }
        .checkbox-group, .radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .chip {
            cursor: pointer;
            background-color: #222;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chip:hover { border-color: #bb86fc; }
        
        input:checked + span {
            color: #bb86fc;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: #222;
            color: white;
            border: 1px solid #444;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #bb86fc;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #9965f4;
            transform: translateY(-2px);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #161616;
            border-left: 5px solid #bb86fc;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            animation: slideUp 0.4s ease forwards;
        }
        .game-card h3 { color: #bb86fc; margin-bottom: 8px; }
        .game-card p { font-size: 0.9rem; color: #ccc; margin-bottom: 5px; }
        .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 8px;
            background-color: #333;
            color: #bb86fc;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #bb86fc;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        <div class="form-card">
            <div class="input-group">

                    <label class="chip"><input type="checkbox" class="platform" value="PS5"> <span>PS5</span></label>
                    <label class="chip"><input type="checkbox" class="platform" value="Switch"> <span>Switch</span></label>
                    <label class="chip"><input type="checkbox" class="platform" value="PC"> <span>PC</span></label>
                </div>
            </div>

            <div class="input-group">

                    <option value="Management">Management & Job Sim</option>
                    <option value="Puzzle">Relaxing Puzzles</option>
                    <option value="Exploration">Cozy Exploration</option>
                    <option value="Future">Coming in 2026</option>
                </select>
            </div>

            <div class="input-group">
                <label>Time Available</label>
                <div class="radio-group">

                        <span>Working (Short Sessions)</span>
                    </label>
                    <label class="chip">

        document.getElementById('recommendBtn').addEventListener('click', () => {
            const selectedPlatforms = Array.from(document.querySelectorAll('.platform:checked')).map(cb => cb.value);
            const selectedGenre = document.getElementById('genre').value;
            const selectedTime = document.querySelector('input[name="time"]:checked').value;

            if (selectedPlatforms.length === 0) {
                alert("Please select at least one platform!");
                return;
            }

            let filtered = games.filter(game => {
                return game.platforms.some(p => selectedPlatforms.includes(p));
            });

            filtered.sort((a, b) => {
                let scoreA = 0;
                let scoreB = 0;
                if (a.genre === selectedGenre) scoreA += 10;
                if (a.time === selectedTime) scoreA += 5;
                if (b.genre === selectedGenre) scoreB += 10;
                if (b.time === selectedTime) scoreB += 5;
                return scoreB - scoreA;
            });

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = ""; 

            if (filtered.length === 0) {
                resultsDiv.innerHTML = `<p style="grid-column: 1/-1; color: #ff6b6b;">No games found for these platforms.</p>`;
            } else {
                filtered.slice(0, 5).forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3>${game.title}</h3>
                        <p><strong>Year:</strong> ${game.year}</p>
                        <p><strong>Platforms:</strong> ${game.platforms.join(", ")}</p>
                        <div class="badge">${game.genre}</div>
                    `;
                    resultsDiv.appendChild(card);
                });
            }
